[project]
name = "trench"
version = "0.1.0"
description = "Desktop tool to select an object in an image, extract it with Segment Anything, and upscale it with Real-ESRGAN."
requires-python = ">=3.12,<3.13"
dependencies = [
    "basicsr>=1.4.2",
    "numpy<2.5",
    "opencv-python>=5.0.0.93",
    "pyside6>=6.11.1",
    "realesrgan>=0.3.0",
    "requests>=2.34.2",
    "segment-anything>=1.0",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "tqdm>=4.70.0",
]

[project.scripts]
trench = "trench.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trench"]

[dependency-groups]
dev = [
    "basedpyright",
    "ruff",
]

[tool.ruff]
target-version = "py312"
exclude = [
    ".git",
    ".venv",
    "models",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
